name: Lint

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "*.json"
      - "*.js"
      - "*.ts"
      - "*.tsx"
      - "*.css"
      - "pnpm-lock.yaml"
      - "eslint.config.js"
      - ".github/workflows/lint.yml"

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint
